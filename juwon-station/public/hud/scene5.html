<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<style>
	* {
		box-sizing: border-box;
	}

	.html,
	body {
		margin: 0;
		width: 100%;
		height: 100%
	}

	.main {
		width: 100%;
		height: 100vh;

		display: flex;
		justify-content: center;
		align-items: center;
		background-color: #000;
	}

	.main>div {
		width: 660px;
		height: 600px;
	}

	.s_wrap {
		width: 660px;
		height: 600px;
		position: relative;
	}

	.hud_animation {
		position: absolute;
		width: 660px;
		height: 600px;
		bottom: 230px;
		right: 30px;
	}

	.hud_animation img {
		position: absolute;
		opacity: 0;
		transition: opacity 0.8s ease-in-out;
	}

	.hud_animation img.show {
		opacity: 1;
	}

	#a1 {
		width: 405px;
		left: 225px;
		top: 405px;
	}

	/* 중앙 바*/
	#a2 {
		width: 60px;
		left: 395px;
		top: 610px;
	}

	/* 중앙 양 사이드 바*/
	#a3 {
		width: 240px;
		left: 305px;
		top: 580px;
	}

	/* 중앙 경고등 */
	#a4 {
		width: 60px;
		left: 393px;
		top: 475px;
	}
</style>
<script>
	document.addEventListener('DOMContentLoaded', function () {

		const a1 = document.getElementById('a1');
		const a2 = document.getElementById('a2');
		const a3 = document.getElementById('a3');
		const a4 = document.getElementById('a4');

		let timers = [];

		function playAnimation() {

			timers.forEach(clearTimeout);
			timers = [];

			// 초기화
			a1.src = 'image/s5/hud_line.svg';
			a2.src = 'image/s5/distance-normal-1.svg';
			a3.src = 'image/s5/distance-normal-2.svg';
			a4.src = 'image/s5/v2x-warning.svg';

			a1.classList.remove('show');
			a2.classList.remove('show');
			a3.classList.remove('show');
			a4.classList.remove('show');

			timers.push(setTimeout(function () {
				a1.classList.add('show');
				a2.classList.add('show');

			}, 0));

			timers.push(setTimeout(function () {
				a3.classList.add('show');
			}, 1000));


			timers.push(setTimeout(function () {
				a4.classList.add('show');
			}, 2000));

			timers.push(setTimeout(function () {
				let count = 0;
				function blinkA4() {
					a4.classList.toggle('show');
					count++;
					if (count < 6) {
						timers.push(
							setTimeout(blinkA4, 500)
						);
					} else {
						a4.classList.add('show');
						changeA4ToA5();
					}
				}
				blinkA4();
			}, 2000));

			function changeA4ToA5() {
				a4.src = 'image/s5/v2x-critical.svg';
				a4.classList.add('show');

				let count = 0;
				function blinkA5() {

					a4.classList.toggle('show');
					count++;

					if (count < 6) {
						timers.push(
							setTimeout(blinkA5, 500)
						);
					} else {
						a4.classList.add('show');
					}
				}
				blinkA5();
			}
		}
		playAnimation();
	});
</script>

<body>
	<div class="main">
		<div>
			<div class="s_wrap">
				<div class="hud_animation">
					<img src="image/s5/hud_line.svg" id="a1">
					<img src="image/s5/distance-normal-1.svg" id="a2">
					<img src="image/s5/distance-normal-2.svg" id="a3">
					<img src="image/s5/v2x-warning.svg" id="a4">
				</div>
			</div>
		</div>
</body>

</html>
